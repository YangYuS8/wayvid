[package]
name = "lwe-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Video and experimental 2D Scene rendering for LWE on Wayland"
repository.workspace = true

[dependencies]
lwe-core = { path = "../lwe-core" }
lwe-scene = { path = "../lwe-scene" }
serde_json = { workspace = true }
serde = { workspace = true }

# Wayland client
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }

# EGL/OpenGL
khronos-egl = { version = "6.0", features = ["dynamic"] }
gl = "0.14"
wayland-egl = "0.32"

# Vulkan (optional)
ash = { version = "0.38", optional = true }
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# Video playback (libmpv)
libmpv-sys = "3.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Event loop
calloop = "0.14"
calloop-wayland-source = "0.4"

# Utilities
bitflags = "2.13"
libc = "0.2"
lz4_flex = "0.13.1"
rquickjs = "=0.11.0"
oxc_allocator = "=0.95.0"
oxc_ast = "=0.95.0"
oxc_parser = { version = "=0.95.0", default-features = false }
oxc_span = "=0.95.0"
libpulse-binding = "2.30.1"
rustfft = "6.4"

[features]
default = ["backend-wayland"]
backend-wayland = []
backend-vulkan = ["dep:ash", "dep:ash-window", "dep:raw-window-handle"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
