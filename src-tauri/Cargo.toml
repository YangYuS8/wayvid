[package]
name = "lwe-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tauri = { version = "=2.12.1", features = ["protocol-asset", "tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lwe-engine = { path = "../crates/lwe-engine" }
lwe-library = { path = "../crates/lwe-library" }
lwe-scene = { path = "../crates/lwe-scene" }
tempfile = { workspace = true }
tauri-plugin-dialog = "=2.8.2"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dev-dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
